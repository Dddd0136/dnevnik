<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Рабочий дневник</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0d0f13;color:#eceef3;font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;visibility:hidden;pointer-events:none;z-index:1;transition:opacity .5s ease,visibility 0s .5s;background:#0d0f13}
  #app.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s ease}
  .splash{position:fixed;inset:0;z-index:4;display:grid;place-items:center;transition:opacity .45s ease,transform .45s ease}
  .splash.off{opacity:0;transform:scale(1.04);pointer-events:none;visibility:hidden;transition:opacity .45s ease,transform .45s ease,visibility 0s .45s}
  .logo{width:88px;height:88px;border-radius:22px;animation:breathe 1.6s ease-in-out infinite;box-shadow:0 18px 50px rgba(94,179,255,.18)}
  @keyframes breathe{50%{transform:scale(1.06)}}
  .name{margin-top:18px;font-size:18px;font-weight:650;text-align:center}
  .hint{margin-top:6px;font-size:13px;color:#6c7486;text-align:center}
  .setup{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:24px}
  .setup.on{display:flex}
  .box{width:100%;max-width:420px;background:#161920;border:1px solid #262b36;border-radius:22px;padding:22px;animation:up .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{opacity:0;transform:translateY(16px)}}
  .box h1{margin:14px 0 6px;font-size:20px}
  .box p{margin:0 0 14px;color:#a0a8b8;font-size:14px}
  input{width:100%;box-sizing:border-box;height:48px;border-radius:14px;border:1px solid #2f3542;background:#0d0f13;color:#eceef3;padding:0 14px;font-size:14px}
  input:focus{outline:none;border-color:#5eb3ff}
  button{width:100%;height:48px;margin-top:12px;border:0;border-radius:14px;background:#5eb3ff;color:#06121f;font-size:16px;font-weight:650}
  button:active{transform:scale(.98)}
  .err{color:#f87171;font-size:13px;min-height:18px;margin-top:8px}
  .off-line{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a303c;border:1px solid #363d4a;padding:10px 16px;border-radius:14px;font-size:14px;display:none}
</style>
</head>
<body>
<div class="splash" id="splash">
  <div><img class="logo" src="icon-192.png" alt=""><div class="name">Рабочий дневник</div><div class="hint" id="hint">Загружаю…</div></div>
</div>

<div class="setup" id="setup">
  <div class="box">
    <img src="icon-192.png" width="56" height="56" style="border-radius:14px" alt="">
    <h1>Подключение</h1>
    <p>Вставь адрес веб-приложения Apps Script (заканчивается на <b>/exec</b>, можно с <b>?k=…</b>). Он сохранится только на этом телефоне.</p>
    <input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <div class="err" id="err"></div>
    <button id="save">Подключить</button>
  </div>
</div>

<iframe id="app" title="Рабочий дневник" allow="clipboard-write; vibrate"></iframe>
<div class="off-line" id="offline">Нет интернета</div>

<script>
var KEY = 'rd_app_url';
var RX = /^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[\w-]+\/exec(\?.*)?$/;

function getUrl(){ try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function setUrl(u){ try { localStorage.setItem(KEY, u); } catch (e) {} }

// Сброс адреса: открыть страницу с #reset
if (location.hash === '#reset') { try { localStorage.removeItem(KEY); } catch (e) {} history.replaceState(null, '', location.pathname); }
// Быстрая настройка: ?app=<адрес>
var qp = new URLSearchParams(location.search).get('app');
if (qp && RX.test(qp)) { setUrl(qp); history.replaceState(null, '', location.pathname); }

function start(){
  var url = getUrl();
  if (!url) {
    document.getElementById('splash').classList.add('off');
    document.getElementById('setup').classList.add('on');
    return;
  }
  var f = document.getElementById('app'), shown = false;
  var show = function(){ if (shown) return; shown = true; f.classList.add('on'); document.getElementById('splash').classList.add('off'); };
  f.addEventListener('load', function(){ setTimeout(show, 350); });
  setTimeout(function(){ document.getElementById('hint').textContent = 'Почти готово…'; }, 4000);
  setTimeout(show, 9000);
  f.src = url;
}

document.getElementById('save').onclick = function(){
  var u = document.getElementById('url').value.trim();
  if (!RX.test(u)) { document.getElementById('err').textContent = 'Это не похоже на адрес веб-приложения (…/macros/s/…/exec)'; return; }
  setUrl(u);
  document.getElementById('setup').classList.remove('on');
  document.getElementById('splash').classList.remove('off');
  start();
};

function net(){ document.getElementById('offline').style.display = navigator.onLine ? 'none' : 'block'; }
window.addEventListener('online', net); window.addEventListener('offline', net); net();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
start();
</script>
</body>
</html>
